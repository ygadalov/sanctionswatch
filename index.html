<!DOCTYPE html>
<html lang="ru" data-theme="light">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>SanctionsWatch — агрегатор санкционных списков</title>
<link rel="icon" type="image/svg+xml" href="favicon.svg">
<link rel="preload" href="fonts/inter-cyrillic.woff2" as="font" type="font/woff2" crossorigin>
<link rel="preload" href="fonts/inter-latin.woff2" as="font" type="font/woff2" crossorigin>
<link rel="stylesheet" href="fonts.css?v=202611220719">
<link rel="stylesheet" href="styles.css?v=202611220719">
</head>
<body>
<header class="top">
  <div class="top-inner">
    <div class="row1">
      <a class="brand" href="#/dashboard">
        <svg width="22" height="22" viewBox="0 0 48 48" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" aria-hidden="true">
          <circle cx="24" cy="24" r="19"/>
          <path d="M24 5v38"/>
          <ellipse cx="24" cy="24" rx="10" ry="19"/>
          <path d="M9 13.5Q24 9.5 39 13.5"/>
          <path d="M9 34.5Q24 38.5 39 34.5"/>
          <path d="M5.5 24C11.5 19 17.5 17 24 17s12.5 2 18.5 7C36 29 30.5 31 24 31s-12.5-2-18.5-7Z" fill="#0F172A"/>
          <circle cx="24" cy="24" r="4.6" fill="currentColor" stroke="none"/>
        </svg>
        <span class="brand-name">Sanctions<b>Watch</b></span>
      </a>
      <span class="sp"></span>
      <div class="top-right">
        <span class="updated" id="updated" title=""></span>
        <button class="hbtn" id="themeToggle" type="button" aria-label="Toggle theme"></button>
        <button class="hbtn" id="langToggle" type="button" aria-label="Switch language">EN</button>
      </div>
    </div>
    <div class="navwrap" id="navwrap">
      <nav class="nav" id="nav">
        <a href="#/dashboard" data-route="dashboard" data-i18n="nav_dash"></a>
        <a href="#/screening" data-route="screening" data-i18n="nav_screen"></a>
        <a href="#/batch" data-route="batch" data-i18n="nav_batch"></a>
        <a href="#/changelog" data-route="changelog" data-i18n="nav_log"></a>
        <a href="#/sources" data-route="sources" data-i18n="nav_sources"></a>
      </nav>
    </div>
  </div>
</header>

<main id="app">
  <!-- DASHBOARD -->
  <section id="view-dashboard" class="view">
    <div class="chips" id="chips"></div>
    <div class="statrow" id="statrow"></div>
    <div class="panel" style="margin-top:24px">
      <h2 class="panel-title" data-i18n="map_title"></h2>
      <div class="mapwrap">
        <svg id="worldmap" viewBox="0 0 1000 470" role="img"></svg>
        <div id="mapTip"></div>
      </div>
      <div class="maplegend"><span>0</span><span class="grad"></span><span id="mapMax"></span></div>
      <div class="maphint" data-i18n="map_hint"></div>
    </div>
    <div class="pair-grid">
      <div class="panel">
        <h2 class="panel-title" data-i18n="by_type"></h2>
        <div id="typeChart" class="bars"></div>
      </div>
      <div class="panel">
        <h2 class="panel-title" data-i18n="measure_title"></h2>
        <div id="measureChart" class="bars"></div>
        <div class="maphint" data-i18n="measure_hint"></div>
      </div>
    </div>
    <div class="pair-grid">
      <div class="panel">
        <h2 class="panel-title" data-i18n="by_country"></h2>
        <div id="countryChart" class="bars"></div>
      </div>
      <div class="panel">
        <h2 class="panel-title" data-i18n="by_program"></h2>
        <div id="programChart" class="bars"></div>
      </div>
    </div>
    <div class="panel" style="margin-top:24px">
      <h2 class="panel-title" data-i18n="years_title"></h2>
      <div id="yearChart"></div>
      <div class="maphint" data-i18n="years_hint"></div>
    </div>
  </section>

  <!-- SCREENING -->
  <section id="view-screening" class="view">
    <div class="screen-bar">
      <div class="search-wrap">
        <div class="qbox">
          <input id="q" type="text" autocomplete="off" spellcheck="false" data-i18n-ph="q_ph">
          <button type="button" id="advToggle" class="qbtn qbtn-tune" aria-expanded="false" data-i18n-title="refine">
            <svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 5h16l-6.5 7.5V19l-3 1.5v-6L4 5z"/></svg>
            <span class="adv-n" id="advN" hidden></span>
          </button>
          <button type="button" id="qClear" class="qbtn qbtn-x" hidden aria-label="×">
            <svg viewBox="0 0 24 24" width="14" height="14" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><path d="M6 6l12 12M18 6L6 18"/></svg>
          </button>
        </div>
        <div class="search-meta" id="searchMeta"></div>
      </div>
      <div class="filters">
        <select id="fSource"><option value="" data-i18n="all_sources"></option></select>
        <select id="fType"><option value="" data-i18n="all_types"></option></select>
      </div>
    </div>
    <div class="adv-panel" id="advPanel" hidden>
      <div class="adv-grid">
        <label class="adv-f"><span data-i18n="adv_year"></span>
          <input id="advYear" type="text" inputmode="numeric" maxlength="4" autocomplete="off" placeholder="1966"></label>
        <label class="adv-f"><span data-i18n="adv_dob"></span>
          <input id="advDob" type="text" inputmode="numeric" maxlength="10" autocomplete="off" data-i18n-ph="adv_dob_ph" placeholder="ДД.ММ.ГГГГ"></label>
        <label class="adv-f"><span data-i18n="adv_country"></span>
          <select id="advCountry"><option value="" data-i18n="adv_any"></option></select></label>
        <label class="adv-f"><span data-i18n="adv_doc"></span>
          <input id="advDoc" type="text" autocomplete="off" placeholder="M788439"></label>
        <label class="adv-f"><span data-i18n="adv_imo"></span>
          <input id="advImo" type="text" autocomplete="off" maxlength="10" placeholder="9253325"></label>
        <button type="button" class="adv-reset" id="advReset" data-i18n="adv_reset"></button>
      </div>
      <p class="adv-hint" data-i18n="adv_hint"></p>
    </div>
    <div class="screen-grid">
      <div class="results" id="results" tabindex="0"></div>
      <aside class="detail" id="detail"></aside>
    </div>
  </section>

  <!-- BATCH -->
  <section id="view-batch" class="view">
    <div class="panel" id="bUploadPanel">
      <h2 class="panel-title" data-i18n="b_title"></h2>
      <p class="muted" data-i18n="b_hint"></p>
      <div class="b-drop" id="bDrop" tabindex="0" role="button">
        <svg viewBox="0 0 24 24" width="28" height="28" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M12 16V4m0 0l-4 4m4-4l4 4"/><path d="M4 16v3a1 1 0 0 0 1 1h14a1 1 0 0 0 1-1v-3"/></svg>
        <div class="b-drop-t" data-i18n="b_drop"></div>
        <div class="muted small" data-i18n="b_drop_sub"></div>
        <input type="file" id="bFile" accept=".xlsx,.xls,.csv" hidden>
      </div>
      <p class="b-tpl"><button type="button" class="btn" id="bTpl" data-i18n="b_tpl"></button></p>
      <p class="muted small" data-i18n="b_privacy"></p>
    </div>

    <div class="panel" id="bMapPanel" hidden>
      <h2 class="panel-title" data-i18n="b_map_title"></h2>
      <p class="muted" id="bFileInfo"></p>
      <div class="b-map" id="bMap"></div>
      <div class="tblwrap b-preview"><table class="tbl" id="bPreview"></table></div>
      <p class="b-actions">
        <button type="button" class="btn btn-primary" id="bRun" data-i18n="b_run"></button>
        <button type="button" class="btn" id="bBack" data-i18n="b_back"></button>
      </p>
    </div>

    <div class="panel" id="bResPanel" hidden>
      <h2 class="panel-title" data-i18n="b_res_title"></h2>
      <div class="b-sum" id="bSum"></div>
      <p class="b-actions">
        <button type="button" class="btn btn-primary" id="bExport" data-i18n="b_export"></button>
        <button type="button" class="btn" id="bAgain" data-i18n="b_again"></button>
      </p>
      <div class="b-resfilter" id="bResFilter"></div>
      <div class="tblwrap"><table class="tbl b-restbl" id="bResTable"></table></div>
    </div>
  </section>

  <!-- CHANGELOG -->
  <section id="view-changelog" class="view">
    <div class="panel">
      <h2 class="panel-title" data-i18n="log_title"></h2>
      <p class="muted" data-i18n="log_hint"></p>
      <p><button id="logCsv" class="btn" type="button" data-i18n="log_csv"></button></p>
      <div id="changelog"></div>
    </div>
  </section>

  <!-- SOURCES -->
  <section id="view-sources" class="view">
    <div class="panel">
      <h2 class="panel-title" data-i18n="src_title"></h2>
      <div class="tblwrap"><table class="tbl srctbl" id="sourcesTable"></table></div>
      <p class="muted small" data-i18n="src_note"></p>
    </div>
  </section>
</main>

<footer class="foot">
  <span data-i18n="foot_data"></span>
  <span class="muted" id="footGen"></span>
</footer>

<script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script>
<script src="app.js?v=202611220719"></script>
</body>
</html>
